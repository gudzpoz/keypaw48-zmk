name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    # This is not a standard zmk-config repository: the west workspace lives
    # inside the zmk/ submodule and the custom modules are wired in through
    # -DZMK_EXTRA_MODULES, so the upstream build-user-config workflow cannot be
    # used. Mirror the local Makefile instead.
    env:
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/.sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          # zmk/.west is deliberately not cached: `make init` recreates it with
          # `west init`, which fails if a workspace is already present.
          path: |
            zmk/zephyr
            zmk/modules
            zmk/bootloader
            zmk/tools
          key: west-${{ runner.os }}-${{ hashFiles('zmk/app/west.yml') }}

      - name: Cache Zephyr SDK
        uses: actions/cache@v4
        with:
          path: .sdk
          key: zephyr-sdk-${{ runner.os }}-${{ hashFiles('zmk/app/west.yml') }}

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Initialize west workspace
        run: |
          source .venv/bin/activate
          make init

      - name: Patch Zephyr SDK finder
        run: |
          finder=zmk/zephyr/cmake/modules/FindZephyr-sdk.cmake
          if grep -q 'STREQUAL "${ZEPHYR_TOOLCHAIN_VARIANT}"' "$finder"; then
            echo "Already patched"
          else
            patch "$finder" scripts/zephyr-issue-113746.patch
          fi

      - name: Install Zephyr SDK
        run: |
          source .venv/bin/activate
          if [ -f "$ZEPHYR_SDK_INSTALL_DIR/sdk_version" ]; then
            echo "Using cached SDK $(cat "$ZEPHYR_SDK_INSTALL_DIR/sdk_version")"
          else
            cd zmk && west sdk install --install-dir="$ZEPHYR_SDK_INSTALL_DIR" -t arm-zephyr-eabi
          fi

      - name: Fetch display assets
        run: |
          source .venv/bin/activate
          # scripts/LVGLImage.py and scripts/*.gif are gitignored ("download
          # from source") but gen_icons.py needs them to generate the display
          # widgets. The nyan.cat gif is 272x168; downscale it to the 68x42 the
          # firmware expects (an exact 4x nearest-neighbour reduction).
          curl -fsSL -o /tmp/nyan_cat.gif https://www.nyan.cat/cats/original.gif
          curl -fsSL -o scripts/LVGLImage.py \
            https://raw.githubusercontent.com/lvgl/lvgl/v9.3.0/scripts/LVGLImage.py
          python - <<'PY'
          from PIL import Image, ImageSequence

          src = Image.open("/tmp/nyan_cat.gif")
          frames = [
              frame.convert("RGBA").resize((68, 42), Image.NEAREST)
              for frame in ImageSequence.Iterator(src)
          ]
          frames[0].save(
              "scripts/nyan_cat.gif",
              save_all=True,
              append_images=frames[1:],
              loop=0,
              duration=src.info.get("duration", 100),
              disposal=2,
          )
          PY

      - name: Generate display widgets
        run: |
          source .venv/bin/activate
          make resources

      - name: Build firmware
        run: |
          source .venv/bin/activate
          make build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: keypaw48-firmware
          path: build/zmk_*.uf2
          if-no-files-found: error
