#################
## Eye Candies ##
#################

## OLED Screen ##
CONFIG_ZMK_DISPLAY=y
# Binary size reduction (compressing images)
CONFIG_LV_USE_RLE=y
# Display sizes
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_16=y
CONFIG_LV_DPI_DEF=291
# The default ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE (3072) is too small for a
# 126x294 RGB888 screen; it silently overflows and freezes.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

## Underglow ##
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20

############
## Inputs ##
############

CONFIG_INPUT=y
CONFIG_SPI=y

## Trackball ##
CONFIG_PAW3395=y
CONFIG_ZMK_POINTING=y

## Touchpad ##
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_USB_HID_DEVICE_COUNT=2

######################
## Power Management ##
######################

# See "Deep Sleep": https://zmk.dev/docs/features/low-power-states#deep-sleep

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

#################
## Development ##
#################

CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_ZMK_LOG_LEVEL_INF=y
