description: |
  Input processor that consumes FT6236 multitouch input events on the central
  half: one contact is converted into relative scroll wheel events (REL_HWHEEL
  / REL_WHEEL), two or more contacts are forwarded as Windows Precision
  Touchpad (Digitizer 0x0D) HID reports. All events are swallowed so the core
  input listener does not treat BTN_TOUCH as a mouse click.

  The per-listener param cells control single-finger scroll sensitivity:
  param1 is the X axis divisor, param2 the Y axis divisor, both in logical
  touchpad units per wheel notch (0 is treated as 1). With
  CONFIG_ZMK_POINTING_SMOOTH_SCROLLING enabled, deltas are emitted in
  1/16-notch subunits for hosts that support HID Resolution Multipliers.

compatible: "zmk,input-processor-ft6236-touchpad"

include: ip_two_param.yaml

properties:
  scroll-natural:
    type: boolean
    description: |
      Natural scrolling direction for single-finger scroll: moving the finger
      up scrolls the content up (wheel negative), matching real touchpads.
      When absent, scroll direction follows a traditional mouse wheel.
  physical-width:
    type: int
    required: true
    description: |
      Physical width of the touch surface in 1/100 inch, reported as the
      HID descriptor PHYSICAL_MAXIMUM of the X axis (the descriptor declares
      UNIT_EXPONENT(-2) + UNIT(Inch)). Measure the actual digitizer active
      area; the host derives scroll velocity from it.
  physical-height:
    type: int
    required: true
    description: |
      Physical height of the touch surface in 1/100 inch, reported as the
      HID descriptor PHYSICAL_MAXIMUM of the Y axis.
