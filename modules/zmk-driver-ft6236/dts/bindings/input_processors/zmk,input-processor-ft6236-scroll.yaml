description: |
  Input processor that consumes the FT6236 single-touch frames on the central
  half and converts the pressed contact's coordinates into relative scroll
  wheel events (REL_HWHEEL / REL_WHEEL). All events are swallowed so the core
  input listener does not treat BTN_TOUCH as a mouse click.

  The per-listener param cells control scroll sensitivity and are in the same
  units as the incoming coordinates, i.e. raw panel pixels: param1 is the X
  pixels per wheel notch, param2 the Y pixels per notch (0 is treated as 1).
  Lower is faster. With CONFIG_ZMK_POINTING_SMOOTH_SCROLLING enabled, deltas are
  emitted in 1/16-notch subunits for hosts that support HID Resolution
  Multipliers; a notch still takes a whole param-worth of pixels.

  Per-touch totals (pixels travelled vs subunits emitted) are logged at debug
  level, so the params can be checked against real travel.

compatible: "zmk,input-processor-ft6236-scroll"

include: ip_two_param.yaml

properties:
  scroll-natural:
    type: boolean
    description: |
      Natural scrolling direction: moving the finger up scrolls the content up
      (wheel negative), matching real touchpads. When absent, scroll direction
      follows a traditional mouse wheel.
